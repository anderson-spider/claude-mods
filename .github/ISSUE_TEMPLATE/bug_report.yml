name: Bug report
description: A plugin or the installation does not work as its README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use placeholders (`gitlab.example.com`, `group/app`) instead of real hosts, project names, paths or tokens. Report a vulnerability privately, as SECURITY.md describes, not here.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin's name, or `installation` for bootstrap.sh and the marketplace.
      placeholder: gitlab
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The plugin version (`claude plugin list`) and `claude --version`.
      placeholder: gitlab 0.3.2, Claude Code 2.1.301
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The prompt or command, and any error. For a hooks module that does not load, add the matching lines from `claude --debug`.
    validations:
      required: true
