name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `claude plugin validate` and `claude plugin test` need the Claude Code CLI
      # and its generated typings, so they stay a local check (see AGENTS.md).
      - name: Marketplace and plugin manifests agree
        run: node scripts/check-consistency.mjs
      - name: Plugins with code changes bumped their version
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"
      - name: codex-computer-use helper tests
        run: node --test plugins/codex-computer-use/helper/test/*.test.mjs

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Go pin lives once, in the root mise.toml; the proxy's go.mod may ask for less.
      - name: Read the Go pin
        id: go
        run: echo "version=$(sed -nE 's/^go = "([^"]+)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: plugins/codex-models/proxy/go.sum
      - name: Proxy vet
        run: go -C plugins/codex-models/proxy vet ./...
      - name: Proxy vet (contract build)
        run: go -C plugins/codex-models/proxy vet -tags contract ./...
      - name: Proxy tests
        run: go -C plugins/codex-models/proxy test -race ./...
      - name: Proxy contract tests
        run: go -C plugins/codex-models/proxy test -race -tags contract ./...

  # install.sh refuses anything but macOS, so its tests (fake mise and launchctl, temporary HOME) run on a Mac.
  install-scripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Node pin
        id: node
        run: echo "version=$(sed -nE 's/^node = "([^"]+)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install script tests
        run: node --test plugins/codex-models/tests/scripts/*.test.mjs
