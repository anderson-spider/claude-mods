name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Marketplace and plugin manifests agree
        run: node scripts/check-consistency.mjs
      - name: Plugins with changed shipped files bumped their version
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"
      - name: Script and hook tests
        run: node --test scripts/*.test.mjs
      - name: codex-computer-use helper tests
        run: node --test plugins/codex-computer-use/helper/test/*.test.mjs

  # Neither command logs in. The typings tsc needs are written by an interactive session, which starts without a login.
  # The pinned row is the required `plugins` check; the latest row shows early what a newer CLI breaks and never fails
  # the run.
  plugins:
    name: ${{ matrix.cli == 'latest' && 'plugins-latest' || 'plugins' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.cli == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        cli: [pinned, latest]
    env:
      # The version the README says the repository is checked with; check-consistency fails when they differ.
      CLAUDE_CLI_PIN: 2.1.300
      CLI: ${{ matrix.cli }}
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and TypeScript
        run: |
          version=$CLAUDE_CLI_PIN
          [ "$CLI" = latest ] && version=latest
          typescript=$(sed -n 's/^"npm:typescript" = "\(.*\)"$/\1/p' mise.toml)
          npm install --global "@anthropic-ai/claude-code@${version}" "typescript@${typescript:?no TypeScript version in mise.toml}"
          claude --version
      # Each step runs every plugin, then fails with the list of those that failed.
      - name: Validate the marketplace and every plugin
        run: |
          failed=()
          claude plugin validate --strict . || failed+=(marketplace)
          for source in $(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.source).join(' ')"); do
            echo "==> validate $source"
            claude plugin validate --strict "$source" || failed+=("$source")
          done
          if [ "${#failed[@]}" -gt 0 ]; then echo "validate failed: ${failed[*]}" >&2; exit 1; fi
      - name: Test every plugin
        run: |
          failed=()
          for source in $(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.source).join(' ')"); do
            echo "==> test $source"
            claude plugin test "$source" || failed+=("$source")
          done
          if [ "${#failed[@]}" -gt 0 ]; then echo "test failed: ${failed[*]}" >&2; exit 1; fi
      # The scaffold runs in a copy so the checkout stays clean.
      - name: Scaffold a sample plugin and check it
        run: |
          cp -R . "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          node scripts/new-plugin.mjs ci-sample "CI sample plugin."
          claude plugin validate --strict plugins/ci-sample
          claude plugin test plugins/ci-sample
      # Same loop as `mise run plugins:types`, on Linux's `script`. A fresh runner has no login: onboarding and folder
      # trust are marked done so the session starts and loads every plugin of the scaffold copy, ci-sample included.
      - name: Type-check every plugin and the sample
        working-directory: ${{ runner.temp }}/scaffold
        run: |
          node -e 'require("fs").writeFileSync(require("os").homedir() + "/.claude.json", JSON.stringify({ hasCompletedOnboarding: true, theme: "dark", projects: { [process.cwd()]: { hasTrustDialogAccepted: true } } }))'
          args=()
          for d in plugins/*/; do args+=(--plugin-dir "${d%/}"); done
          ready() { for d in plugins/*/; do [ -f "${d}.claude-plugin/types/tsconfig.json" ] || return 1; done; }
          { for _ in $(seq 120); do ready && break; sleep 1; done; sleep 2; printf '/exit\r'; } | script -q -e -c "claude ${args[*]}" /dev/null >/dev/null 2>&1 || true
          ready || { echo "Claude Code did not write the typings" >&2; exit 1; }
          failed=()
          for d in plugins/*/; do
            echo "==> tsc ${d%/}"
            tsc -p "${d}tsconfig.json" || failed+=("${d%/}")
          done
          if [ "${#failed[@]}" -gt 0 ]; then echo "tsc failed: ${failed[*]}" >&2; exit 1; fi
