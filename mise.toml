# Development tools for this repository: `mise install` once, then the tools follow the directory.
# Node runs scripts/*.mjs and the TypeScript language server; TypeScript 7 serves `tsc --lsp` and type-checks with
# `tsc -p plugins/<name>/tsconfig.json` (the typings it extends are written by Claude Code when it loads the plugin).
[tools]
node = "24"
"npm:typescript" = "7.0.2"

[tasks."worktree:add"]
description = "Create an andersonsilva worktree and generate every plugin's typings"
usage = '''
arg "<name>" help="Worktree name"
arg "[base]" help="Base ref (<remote>/<ref>)" default="origin/main"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
name=${usage_name?}
base=${usage_base?}
[[ "$name" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || { echo "invalid worktree name: $name" >&2; exit 1; }
remote=${base%%/*}
ref=${base#*/}
if [[ "$base" != */* || "$base" == *:* || "$base" == -* || "$ref" == -* || "$base" == *..* || "$base" == *@\{* ]]; then
  echo "invalid base ref: $base (expected <remote>/<ref>)" >&2
  exit 1
fi
if ! git remote get-url "$remote" >/dev/null 2>&1 || ! git check-ref-format --branch "$ref" >/dev/null 2>&1; then
  echo "invalid base ref: $base (expected an existing remote and a valid ref)" >&2
  exit 1
fi
branch="andersonsilva/$name"
git check-ref-format --branch "$branch" >/dev/null
# The shared Git directory anchors the sibling worktree directory even from another worktree.
common=$(git rev-parse --path-format=absolute --git-common-dir)
path="$(dirname "$(dirname "$common")")/claude-mods-worktrees/$name"
if git show-ref --verify --quiet "refs/heads/$branch"; then
  echo "branch already exists: $branch" >&2
  exit 1
fi
if [ -e "$path" ] || [ -L "$path" ]; then
  echo "worktree path already exists: $path" >&2
  exit 1
fi
git fetch -- "$remote" "$ref"
git worktree add -b "$branch" -- "$path" "$base"
mise trust "$path/mise.toml"
mise -C "$path" run plugins:types
printf '%s\n' "$path"
'''

[tasks."plugins:validate"]
description = "Validate the marketplace and every plugin, then check that the manifests agree"
run = '''
#!/usr/bin/env bash
set -euo pipefail
claude plugin validate --strict .
for p in plugins/*/; do echo "==> $(basename "$p")"; claude plugin validate --strict "${p%/}"; done
node scripts/check-consistency.mjs
'''

# The output lists each hook with its event and `.catch`, plus the calls and state a plugin reads and writes, so a refactor
# PR can diff it: run this, `mv .scan .scan.before`, change the code, run it again and `diff -r .scan.before .scan`.
# The repository path is stripped so the files compare across worktrees. Neither directory is committed.
[tasks."plugins:scan"]
description = "Save each plugin's `claude plugin validate --strict` output under .scan/ for diffing"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p .scan
status=0
for p in plugins/*/; do
  name=$(basename "$p")
  claude plugin validate --strict "${p%/}" > ".scan/$name.raw" 2>&1 || status=1
  sed "s#$PWD/##g" ".scan/$name.raw" > ".scan/$name.txt"
  rm ".scan/$name.raw"
  echo "saved .scan/$name.txt"
done
exit $status
'''

[tasks."plugins:test"]
description = "Run the scripts and hooks tests, every plugin's tests, and the codex-computer-use helper's when the ChatGPT app's node is present"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "==> scripts and hooks"
node --test scripts/*.test.mjs
for p in plugins/*/; do echo "==> $(basename "$p")"; claude plugin test "${p%/}"; done
cua_node=/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node
if [ -x "$cua_node" ]; then
  echo "==> codex-computer-use helper"
  "$cua_node" --test plugins/codex-computer-use/helper/test/*.test.mjs
else
  echo "==> codex-computer-use helper: skipped, $cua_node not found"
fi
'''

[tasks."plugins:update"]
description = "Refresh the marketplace and update every installed plugin from it, in its own scope"
run = "node scripts/update-plugins.mjs"

[tasks."update:all"]
description = "From the main checkout: pull main and update every installed plugin"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$(git rev-parse --path-format=absolute --git-dir)" != "$(git rev-parse --path-format=absolute --git-common-dir)" ]; then
  echo "run update:all from the main checkout, not a worktree" >&2
  exit 1
fi
if [ -n "$(git status --porcelain)" ]; then
  echo "the working tree has changes; commit or stash them first" >&2
  exit 1
fi
echo "==> main"
git switch main
git pull --ff-only
echo "==> plugins"
mise run plugins:update
claude plugin list --json | node -e '
  const rows = JSON.parse(require("fs").readFileSync(0, "utf8")).filter(p => p.id.endsWith("@spider-claude-mods"))
  for (const p of rows) console.error(`${p.id} ${p.version} (${p.scope}${p.enabled ? "" : ", disabled"})`)
'
echo "done: run /reload-plugins in running sessions, or start a new one (crew twins register only in a new session)"
'''

# Claude Code writes plugins/*/.claude-plugin/types/ only when an interactive session loads a plugin from its folder,
# so this opens one on a pseudo-terminal with the plugin (or every plugin) and exits once each has its typings.
[tasks."plugins:types"]
description = "Generate the claude-code typings one plugin's (or every plugin's) tsconfig.json extends"
usage = '''
arg "[name]" help="Plugin to generate for (default: every plugin)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
name=${usage_name:-}
if [ -n "$name" ]; then
  [[ "$name" =~ ^[a-z][a-z0-9-]*$ && -d "plugins/$name" ]] || { echo "no such plugin: $name" >&2; exit 1; }
  dirs=("plugins/$name/")
else
  dirs=(plugins/*/)
fi
args=()
for d in "${dirs[@]}"; do args+=(--plugin-dir "${d%/}"); done
ready() { for d in "${dirs[@]}"; do [ -f "${d}.claude-plugin/types/tsconfig.json" ] || return 1; done; }
{ for _ in $(seq 120); do ready && break; sleep 1; done; sleep 2; printf '/exit\r'; } | script -q /dev/null claude "${args[@]}" >/dev/null 2>&1 || true
ready || { echo "typings were not written for ${name:-every plugin}" >&2; exit 1; }
echo "typings written for ${name:-every plugin}"
'''

# Everything check-consistency requires is written, so the plugin passes it with only the text left to fill in.
[tasks."plugin:new"]
description = "Scaffold a plugin that passes the consistency checks, then generate its typings"
usage = '''
arg "<name>" help="Plugin name: lowercase words joined by single hyphens"
arg "[description]" help="One-line description (default: a placeholder to replace)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
name=${usage_name?}
node scripts/new-plugin.mjs "$name" ${usage_description:+"$usage_description"}
mise run plugins:types "$name" || { echo "scaffolded, but the typings were not written: run mise run plugins:types $name" >&2; exit 1; }
'''
